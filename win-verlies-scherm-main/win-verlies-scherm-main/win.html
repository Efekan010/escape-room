<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dark House – Ontsnapt</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="drip-container">
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
    <div class="drip"></div>
  </div>

  <div class="particles" id="particles"></div>

  <section class="win-card">
    <div class="eyeball">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="30" cy="30" rx="28" ry="20" fill="#1a1a1a" stroke="#c0000a" stroke-width="1.5"/>
        <circle cx="30" cy="30" r="10" fill="#0a0a0a"/>
        <circle cx="30" cy="30" r="6" fill="#c0000a" opacity="0.85"/>
        <circle cx="33" cy="27" r="2" fill="white" opacity="0.4"/>
      </svg>
    </div>

    <h1>Je bent ontsnapt…</h1>
    <div class="divider"></div>
    <p class="subtitle">…maar was je <em>echt alleen</em>?</p>
    <p class="body-text">
      Je hebt de duisternis doorstaan.<br>
      De deuren zijn achter je dichtgevallen.<br>
      Toch voelt de stilte buiten net iets te zwaar.
    </p>
    <a href="index.html" class="btn-back">← Terug naar start</a>
  </section>

  <script>
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
      container.appendChild(p);
    }
  </script>
</body>
</html>
